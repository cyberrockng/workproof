name: WorkProof CI

# Every `uses:` below is pinned to a full commit SHA, not a mutable tag --
# semgrep (yaml.github-actions.security.github-actions-mutable-action-tag)
# flagged the previous `@v4`/`@v1`-style refs: tags/branches can be
# silently repointed by the action owner (or a compromised account),
# enabling supply-chain attacks, as happened to tj-actions/changed-files
# and reviewdog/action-setup in real incidents. The trailing `# vX.Y.Z`
# comment records which real release each SHA corresponds to, resolved via
# the GitHub API, not guessed.
on:
  pull_request:
  push:
    branches:
      - main
      - codex/workproof

permissions:
  contents: read

jobs:
  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    steps:
      # submodules: recursive is required -- contracts/WorkProofEscrow.sol
      # imports from lib/flare-foundry-periphery-package, and the default
      # checkout (no submodules) previously made forge build fail here.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
      # lib/flare-foundry-periphery-package manages its own OpenZeppelin/
      # LayerZero dependencies via soldeer, not nested git submodules --
      # its dependencies/ dir is gitignored inside that submodule and only
      # exists after this. Without it, forge build fails on missing
      # OpenZeppelin imports even with submodules: recursive above.
      - run: forge soldeer install
        working-directory: lib/flare-foundry-periphery-package
      - run: forge fmt --check
      - run: forge build
      - run: forge test
      # RealRegistryFork.t.sol forks live Coston2 (read-only calls +
      # vm.prank impersonation, never a real signed tx) -- no secrets needed.
      - run: forge coverage --ir-minimum

  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.25.12"
          cache-dependency-path: |
            go/go.sum
            tools/go.sum
      # See the same step in the contracts job above -- needed before any
      # forge build, including the one generate-workproof-bindings.sh runs.
      - run: forge soldeer install
        working-directory: lib/flare-foundry-periphery-package
      # go/pkg/contracts/workproofescrow's abigen bindings are generated,
      # not committed (see .gitignore) -- must be produced fresh here or
      # internal/verifier fails to compile at all.
      - run: bash scripts/generate-workproof-bindings.sh
      - name: gofmt check
        working-directory: go
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            echo "::error::gofmt found unformatted files (listed above) -- run 'gofmt -w .'"
            exit 1
          fi
      - run: go vet ./...
        working-directory: go
      - run: go test ./... -race -cover
        working-directory: go

  tools:
    name: Tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.25.12"
          cache-dependency-path: |
            go/go.sum
            tools/go.sum
      # See the same step in the contracts job above.
      - run: forge soldeer install
        working-directory: lib/flare-foundry-periphery-package
      # tools/pkg/utils/instructions.go (original scaffold code, still
      # present and still compiled as part of this module) imports the
      # helloworld package, so its bindings are needed here too, in
      # addition to workproofescrow's -- both are generated, not committed.
      # Missing this exact step is what broke this job the first time this
      # CI fix was pushed (confirmed via the actual failed run before
      # adding this).
      - run: bash scripts/generate-bindings.sh
      - run: bash scripts/generate-workproof-tools-bindings.sh
      - name: gofmt check
        working-directory: tools
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            echo "::error::gofmt found unformatted files (listed above) -- run 'gofmt -w .'"
            exit 1
          fi
      - run: go vet ./...
        working-directory: tools
      # Unit tests only -- integration/ needs //go:build integration and a
      # live chain node, not something CI can provide.
      - run: go test ./...
        working-directory: tools

  schemas:
    name: Schemas & workspace packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Runs every workspace package's own "test" script (packages/schema,
      # packages/test-bundle-sdk, relayer, web), not just packages/schema.
      # node --test exits 0 with zero tests found, so this stays green and
      # honestly reflects the placeholder packages' real state rather than
      # silently skipping them.
      - run: pnpm -r test
